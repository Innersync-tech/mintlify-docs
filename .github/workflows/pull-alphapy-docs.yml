name: Pull Alphapy docs

# Mintlify writes with GITHUB_TOKEN (this repo). Alphapy is public, so no PAT.
# Optional instant trigger: repository_dispatch event_type=sync-alphapy-docs
# from alphapy (DOCS_SYNC_TOKEN with Actions: Write). Otherwise hourly cron.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-alphapy-docs]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pull-alphapy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pull-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mintlify-docs
        uses: actions/checkout@v4

      - name: Checkout Alphapy docs source
        uses: actions/checkout@v4
        with:
          repository: Innersync-tech/alphapy
          path: alphapy-src
          persist-credentials: false

      - name: Sync alphapy/docs into synced/alphapy
        run: |
          mkdir -p synced/alphapy
          rsync -av --delete alphapy-src/docs/ synced/alphapy/ \
            --exclude=README.md \
            --exclude=index.md \
            --exclude=terms-of-service.md \
            --exclude=privacy-policy.md \
            --exclude=pricing.md \
            --exclude=legal.md \
            --exclude=_config.yml \
            --exclude=CNAME \
            --exclude=premium-local-insert.md \
            --exclude=hermit-core-rollout.md \
            --exclude=testers-plan.md \
            --exclude=CONTRIBUTOR.md \
            --exclude=premium-layer-plan.md

      - name: Verify publication safety
        run: bash alphapy-src/.github/scripts/verify-publication-safe.sh synced/alphapy

      - name: Remove Alphapy checkout
        run: rm -rf alphapy-src

      - name: Commit and push when changed
        run: |
          git add -A synced/alphapy
          if git diff --cached --quiet; then
            echo "No docs changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: pull Alphapy docs from bot repository"
          git push
